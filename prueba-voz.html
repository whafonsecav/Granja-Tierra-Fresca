<!DOCTYPE html>
<html lang="es-CO">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prueba de voz — Granja Tierra Fresca</title>

<!--
  ======================================================================
  Pagina de diagnostico. No es parte de la campana.

  Existe porque la campana funcionaba en unos aparatos y en otros no, y
  discutirlo a base de suposiciones no llevaba a ningun lado. Esta pagina
  le hace tres preguntas al aparato y ensena las respuestas.

  PRUEBA 1 — ¿habla sin que nadie toque nada?
      Se intenta hablar al abrir. La prueba no es que speak() no de error:
      es que dispare "onstart". En iOS, speaking llega a devolver true con
      la locucion encolada y muda.

      Un navegador solo deja hablar sola a una pagina que ya conoce. Lleva
      la cuenta de cuanto audio ha sonado antes en ese sitio, y hasta que
      no acumula suficiente, la bloquea. Por eso un telefono que ya visito
      la campana varias veces habla solo, y uno que la abre por primera vez
      no. Es la diferencia entre probarla uno mismo y prestarsela a
      alguien.

  PRUEBA 2 — cancelar y hablar en el mismo instante.
      Es lo que hacia la campana al tocar la pantalla: limpiaba la cola de
      la bienvenida bloqueada y hablaba enseguida. cancel() no vacia la
      cola en el acto, y la locucion que se mete en medio puede irse con la
      basura.

  PRUEBA 3 — cancelar, esperar un respiro, y hablar.
      Lo mismo, pero dandole tiempo a la limpieza.

  Si la 2 falla y la 3 funciona, la causa esta demostrada y el arreglo es
  exactamente ese respiro.

  Todo lo que averigua se ensena en letra grande y se dice en voz alta,
  para que sirva igual mirandola que escuchandola.
  ======================================================================
-->

<style>
  :root { color-scheme: light dark; }
  body {
    margin: 0; padding: 24px 20px 60px;
    font-family: "Segoe UI", system-ui, -apple-system, Arial, sans-serif;
    font-size: 17px; line-height: 1.6;
    max-width: 40rem; margin-inline: auto;
  }
  h1 { font-size: 1.5rem; line-height: 1.25; margin: 0 0 4px; }
  .sub { color: #666; margin: 0 0 26px; font-size: .95rem; }

  .resultado {
    border: 3px solid currentColor; border-radius: 12px;
    padding: 18px 20px; margin: 0 0 22px; font-size: 1.15rem;
  }
  .si   { color: #14670f; background: #eefaec; }
  .no   { color: #8c1d16; background: #fdeeed; }
  .duda { color: #6b5300; background: #fdf7e3; }

  dl { margin: 0; }
  dt { font-weight: 700; margin-top: 14px; }
  dd { margin: 2px 0 0; }

  button {
    display: block; width: 100%; min-height: 76px; margin: 26px 0 0;
    font: inherit; font-size: 1.15rem; font-weight: 700;
    color: #fff; background: #a81f18;
    border: 0; border-radius: 12px; cursor: pointer;
  }
  button:focus-visible { outline: 4px solid #ffd24a; outline-offset: 3px; }
  button[disabled] { opacity: .45; }

  code { font-size: .9em; word-break: break-all; }
  @media (prefers-color-scheme: dark) {
    body { background: #141414; color: #eee; }
    .sub { color: #aaa; }
    .si { background: #16240f; } .no { background: #2a1412; } .duda { background: #26210f; }
  }
</style>
</head>
<body>

<h1>¿Por qué esta página se queda muda en unos teléfonos y en otros no?</h1>
<p class="sub">Prueba de la Granja Tierra Fresca. No forma parte de la campaña.</p>

<div class="resultado duda" id="veredicto" role="status" aria-live="polite">
  Probando… espera unos segundos sin tocar la pantalla.
</div>

<dl id="datos"></dl>

<button id="probar" type="button">
  Ahora tócame: aquí empieza la prueba de verdad
</button>

<script>
(function () {
  "use strict";

  var TTS = window.speechSynthesis || null;
  var veredicto = document.getElementById("veredicto");
  var datos = document.getElementById("datos");
  var boton = document.getElementById("probar");

  var sonoSinGesto = false;

  function apuntar(titulo, valor) {
    var dt = document.createElement("dt");
    var dd = document.createElement("dd");
    dt.textContent = titulo;
    dd.textContent = valor;
    datos.appendChild(dt);
    datos.appendChild(dd);
  }

  function veredicto_(clase, texto) {
    veredicto.className = "resultado " + clase;
    veredicto.textContent = texto;
  }

  // Cada frase empieza por una palabra desechable, igual que en la campana.
  // Los motores de voz se comen el principio de la primera locucion despues
  // de un silencio, y aqui eso importa el doble: si se comieran el "Prueba
  // uno", quien esta escuchando no sabria cual de las pruebas oyo.
  //
  // El idioma se pide como "es" a secas, no "es-CO". Un motor de celular
  // suele traer es-ES o es-US, y pedirle un pais que no tiene es una forma
  // de quedarse mudo sin enterarse.
  function nueva(texto) {
    var u = new window.SpeechSynthesisUtterance("Atención. " + texto);
    u.lang = "es";
    return u;
  }

  // ---- Lo que se puede saber sin probar nada -----------------------------
  apuntar("Navegador", navigator.userAgent);
  apuntar("¿Existe speechSynthesis?", TTS ? "Sí" : "No");
  apuntar("¿Existe reconocimiento de voz?",
          (window.SpeechRecognition || window.webkitSpeechRecognition) ? "Sí" : "No");

  if (!TTS || typeof window.SpeechSynthesisUtterance !== "function") {
    veredicto_("no", "Este navegador no tiene voz sintética. La página no puede hablar aquí de ninguna forma.");
    boton.hidden = true;
    return;
  }

  function listarVoces() {
    var v = TTS.getVoices() || [];
    var esp = [];
    var i;
    for (i = 0; i < v.length; i++) {
      if (/^es/i.test(v[i].lang)) { esp.push(v[i].name + " (" + v[i].lang + ")"); }
    }
    apuntar("Voces instaladas", v.length ? String(v.length) : "todavía ninguna");
    apuntar("Voces en español", esp.length ? esp.join(", ") : "ninguna");
  }
  window.setTimeout(listarVoces, 1500);

  // ---- Prueba 1: hablar sin que nadie toque nada -------------------------
  var u1 = nueva("Prueba uno. Si oyes esta frase, este aparato deja hablar a la " +
                 "página sin que toques nada.");
  u1.onstart = function () { sonoSinGesto = true; };
  try { TTS.speak(u1); } catch (e) { /* sin efecto */ }

  window.setTimeout(function () {
    apuntar("1. ¿Habló sin tocar la pantalla?", sonoSinGesto ? "SÍ" : "NO");
    if (sonoSinGesto) {
      veredicto_("duda",
        "Este aparato deja hablar a la página sin tocarla. Es señal de que ya " +
        "conoce el sitio. Toca el botón para seguir con la prueba importante.");
    } else {
      veredicto_("duda",
        "Este aparato NO deja hablar a la página hasta que la toques. Es lo " +
        "normal la primera vez que se abre un sitio. Toca el botón de abajo: " +
        "ahí viene lo que de verdad importa.");
    }
  }, 4000);

  // ---- Pruebas 2 y 3: dentro del gesto -----------------------------------
  //
  // Las dos hacen lo mismo salvo por un detalle: la 2 habla en el mismo
  // instante en que cancela, y la 3 le deja un respiro a la cancelacion.
  // Ese detalle es toda la hipotesis.
  function intentar(texto, respiro, cuandoSeSepa) {
    var arranco = false;
    var motivo = "no arrancó, y sin decir por qué";

    function lanzar() {
      var u = nueva(texto);
      u.onstart = function () { arranco = true; };
      u.onerror = function (ev) {
        motivo = "error: " + ((ev && ev.error) ? ev.error : "sin detalle");
      };
      try { TTS.speak(u); } catch (e) { motivo = "speak() lanzó una excepción"; }
    }

    try { TTS.cancel(); } catch (e) { /* sin efecto */ }
    if (respiro) { window.setTimeout(lanzar, respiro); } else { lanzar(); }

    window.setTimeout(function () {
      cuandoSeSepa(arranco, motivo);
    }, 3000 + respiro);
  }

  boton.addEventListener("click", function () {
    boton.disabled = true;
    boton.textContent = "Probando… espera y escucha";
    veredicto_("duda", "Probando. Vas a oír dos frases, o quizá solo una. Espera unos segundos.");

    // Prueba 2 — cancelar y hablar en el mismo instante.
    intentar("Prueba dos. Esta frase salió cancelando y hablando al mismo tiempo.",
             0,
             function (sono2, motivo2) {
      apuntar("2. Cancelar y hablar a la vez", sono2 ? "SÍ habló" : "NO habló — " + motivo2);

      // Prueba 3 — cancelar, esperar, y hablar.
      intentar("Prueba tres. Esta frase salió dejando un respiro después de cancelar.",
               120,
               function (sono3, motivo3) {
        apuntar("3. Cancelar, esperar y hablar", sono3 ? "SÍ habló" : "NO habló — " + motivo3);

        boton.textContent = "Volver a probar";
        boton.disabled = false;

        var v;
        if (!sono2 && sono3) {
          v = ["si",
               "DEMOSTRADO. Este aparato pierde la voz cuando se cancela y se " +
               "habla en el mismo instante, y la recupera si se le deja un " +
               "respiro. Es exactamente lo que le pasaba a la campaña, y el " +
               "arreglo ya está hecho."];
        } else if (sono2 && sono3) {
          v = ["si",
               "Este aparato habla en los dos casos. Aquí la campaña debería " +
               "funcionar. Si no lo hace, la causa es otra."];
        } else if (!sono2 && !sono3) {
          v = ["no",
               "Este aparato no habló en ninguno de los dos casos. Lo más " +
               "probable es que esté en silencio, con el volumen bajo, o sin " +
               "ninguna voz instalada. Mira arriba cuántas voces aparecen."];
        } else {
          v = ["duda",
               "Habló al cancelar y no al esperar, que es al revés de lo " +
               "esperado. Vuelve a probar: puede haber sido un tropiezo suelto " +
               "del motor de voz."];
        }
        veredicto_(v[0], v[1]);

        // El veredicto tambien se dice, que para eso es una prueba de voz.
        window.setTimeout(function () {
          try { TTS.cancel(); } catch (e) { /* sin efecto */ }
          window.setTimeout(function () {
            try { TTS.speak(nueva(v[1])); } catch (e) { /* sin efecto */ }
          }, 120);
        }, 400);
      });
    });
  });
})();
</script>

</body>
</html>
