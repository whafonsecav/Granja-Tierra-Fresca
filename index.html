<!DOCTYPE html>
<html lang="es-CO">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Granja Tierra Fresca</title>
<meta name="description" content="Una experiencia sonora de dos minutos: el tomate de guiso de la Granja Tierra Fresca.">
<meta name="theme-color" content="#1b1006">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!--
  ======================================================================
  En pantalla no hay NADA. Ni titulares, ni botones, ni reproductor.
  Solo el fondo de la granja, desenfocado hasta volverse manchas.

  Todo lo que hay en este archivo es una de estas tres cosas:

    a) el fondo decorativo, marcado aria-hidden;
    b) la superficie de arranque, transparente y del tamano de la
       pantalla, cuyo unico contenido es su aria-label;
    c) texto reservado a lectores de pantalla, invisible a la vista.

  Sobre (c): no contradice el "en pantalla no habra nada". Es la red de
  seguridad del usuario ciego. Si el equipo no tiene una voz espanola
  instalada, speechSynthesis no puede hablar, y sin esta region la
  pagina se quedaria muda y sin salida. Con ella, el lector de pantalla
  del propio usuario narra lo mismo, en espanol y a su velocidad.
  ======================================================================
-->

<div id="fondo" aria-hidden="true"></div>
<div id="velo" aria-hidden="true"></div>

<!-- Region de anuncios. Invisible. Es el canal de respaldo de la voz. -->
<p id="anuncio" class="solo-lectores" role="status" aria-live="assertive" aria-atomic="true"></p>

<!--
  Superficie de arranque. Ocupa la pantalla completa y es transparente.
  Recibe el foco apenas carga la pagina: eso hace que el lector de
  pantalla lea su aria-label de inmediato, sin que el usuario tenga que
  buscar nada. El aria-label lo escribe script.js segun el dispositivo:
  "toque la pantalla" en celular, "oprima cualquier tecla" en computador.
-->
<div id="arranque" role="button" tabindex="0" aria-label="Cargando."></div>

<!-- Sin atributo controls: no debe aparecer reproductor en pantalla. -->
<audio id="audio" src="audio/experiencia.mp3" preload="auto"></audio>

<!-- Enlace de descarga del PDF. Oculto: lo dispara el script, no el usuario. -->
<a id="descarga" class="solo-lectores"
   href="docs/Tomate-de-Guiso-Tierra-Fresca.pdf"
   download="Tomate-de-Guiso-Tierra-Fresca.pdf"
   tabindex="-1" aria-hidden="true">Propuesta en PDF</a>

<!-- Los textos de la voz, en los cinco idiomas. Va primero porque script.js
     los necesita ya cargados. -->
<script src="idiomas.js"></script>
<script src="script.js"></script>
</body>
</html>
