<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" lang="es-CO" xml:lang="es-CO">
<head>
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Un mensaje para ti</title>

<!-- Le dice al cliente de correo que la pieza sabe verse en claro y en
     oscuro. Sin esto, Outlook y Apple Mail invierten los colores por su
     cuenta y suelen ensuciar el boton. -->
<meta name="color-scheme" content="light dark" />
<meta name="supported-color-schemes" content="light dark" />

<!--
  ====================================================================
  Granja Tierra Fresca — correo de campaña

  Destinatario: docente universitario, ciego de nacimiento, usuario
  experto de lector de pantalla.

  QUÉ ES ESTE CORREO: un botón. Literalmente nada más.

  Sin encabezado, sin párrafos, sin logo, sin firma, sin imágenes, sin
  pie de página. Un solo enlace en todo el mensaje.

  POR QUÉ NO DICE DE QUÉ SE TRATA

  Ni "tomate", ni "granja", ni "cocina". Un correo que nombra el
  producto en la primera frase se clasifica solo como publicidad antes
  de que el destinatario termine de oírlo, y con un lector de pantalla
  eso ocurre en dos segundos. Lo único que promete es lo que de verdad
  se está ofreciendo: dos minutos grabados para él.

  DÓNDE ESTÁ EL GANCHO

  En el asunto y en el botón, que son las dos únicas cosas que existen:

      Asunto: Tenemos un mensaje especial para ti
      Botón:  Grabamos dos minutos pensando en ti

  Las dos frases se responden entre sí, y ninguna revela nada.

  SOBRE LA LECTURA AUTOMÁTICA

  Ningún cliente de correo reproduce audio al abrirse: Outlook, Gmail y
  Mail de iOS eliminan <audio>, <script> e <iframe> al recibir. Pero la
  lectura automática SÍ ocurre, y no la dispara el correo: la dispara
  el lector de pantalla que el destinatario ya tiene encendido, que le
  narra remitente, asunto y vista previa mientras recorre su bandeja.

  Como el correo no tiene más texto que el botón, la vista previa la
  ocupa el texto del botón. Por eso las dos frases están escritas para
  oírse seguidas, en ese orden.
  ====================================================================
-->

<style type="text/css">
  body, table, td, a { -webkit-text-size-adjust: 100%; -ms-text-size-adjust: 100%; }
  table { border-collapse: collapse !important; }
  body  { margin: 0 !important; padding: 0 !important; width: 100% !important; }

  /* Modo oscuro. El botón conserva su rojo en los dos modos: es el único
     elemento de la pieza y tiene que verse igual de contundente. */
  @media (prefers-color-scheme: dark) {
    .fondo  { background-color: #1b1b1b !important; }
  }

  @media screen and (max-width: 620px) {
    .contenedor { width: 100% !important; }
    .relleno    { padding-left: 18px !important; padding-right: 18px !important; }
    .boton      { font-size: 20px !important; padding: 26px 20px !important; }
  }
</style>
</head>

<body class="fondo" style="margin:0; padding:0; background-color:#ffffff;">

<!--
  Vista previa oculta. Solo sobrevive si el correo se envía desde Outlook
  de escritorio; en Outlook Web se pierde al copiar y pegar, y entonces la
  vista previa pasa a ser el texto del botón. Dice lo mismo a propósito,
  para que el resultado sea idéntico por los dos caminos.
-->
<div style="display:none; font-size:1px; color:#ffffff; line-height:1px; max-height:0px; max-width:0px; opacity:0; overflow:hidden;">
  Grabamos dos minutos pensando en ti.
  &#8203;&#8203;&#8203;&#8203;&#8203;&#8203;&#8203;&#8203;&#8203;&#8203;&#8203;&#8203;&#8203;&#8203;&#8203;&#8203;&#8203;&#8203;&#8203;&#8203;&#8203;&#8203;&#8203;&#8203;&#8203;&#8203;&#8203;&#8203;&#8203;&#8203;
</div>

<table role="presentation" class="fondo" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#ffffff;">
  <tr>
    <td align="center" style="padding:44px 12px;">

      <table role="presentation" class="contenedor" width="560" cellpadding="0" cellspacing="0" border="0" style="width:560px; max-width:560px;">
        <tr>
          <td class="relleno" align="center" style="padding:0 30px;">

            <!--
              EL BOTÓN. Un enlace real dentro de una celda con color de
              fondo: no es imagen y no es VML. Se ve en Outlook, se
              alcanza con Tab, y el lector de pantalla lo anuncia como
              enlace con su texto completo.

              El texto no dice "haz clic aquí", que a un lector de
              pantalla no le comunica nada, ni describe el producto, que
              arruinaría la sorpresa. Dice qué le espera, cuánto dura y
              qué hacer.

              LO QUE NO SE VE, Y ES LO QUE GUÍA AL DESTINATARIO:

              El atributo aria-label reemplaza el texto del enlace para
              el lector de pantalla, y ahí va la instrucción completa:
              qué es, cuánto dura, que se escucha en vez de leerse, y que
              se abre con Enter. En pantalla siguen siendo dos líneas
              cortas; al oído es una indicación entera.

              Funciona en Outlook Web, Gmail y Apple Mail, que renderizan
              HTML de verdad. Outlook de escritorio usa el motor de Word
              e ignora ARIA: por eso el texto visible tiene que bastarse
              solo, y por eso dice "Ábrelo aquí para escucharlo" en vez
              de un "clic aquí" que allí no comunicaría nada.

              No se pone "Enlace" en el texto: el lector de pantalla ya
              anuncia por su cuenta que es un enlace, y repetirlo suena a
              tartamudeo.
            -->
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
              <tr>
                <td bgcolor="#c1272d" align="center" style="background-color:#c1272d; border-radius:8px;">
                  <a class="boton"
                     href="https://whafonsecav.github.io/Granja-Tierra-Fresca/"
                     lang="es-CO"
                     aria-label="Grabamos dos minutos pensando en ti. Ábrelo para escucharlo: es un mensaje sonoro, dura dos minutos y no hay nada que leer. Presiona Enter para abrirlo."
                     title="Ábrelo para escucharlo. Dura dos minutos."
                     style="display:block; padding:30px 26px; font-family:Georgia,'Times New Roman',serif; font-size:23px; font-weight:normal; line-height:33px; color:#ffffff; text-decoration:none;">
                    Grabamos dos minutos pensando en ti<br />
                    <span style="font-family:Arial,Helvetica,sans-serif; font-size:16px; line-height:26px; color:#ffe3e3;">Ábrelo aquí para escucharlo</span>
                  </a>
                </td>
              </tr>
            </table>

          </td>
        </tr>
      </table>

    </td>
  </tr>
</table>

</body>
</html>
