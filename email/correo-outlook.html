<title>Escuchar la experiencia del tomate de guiso</title>
<!--
  ====================================================================
  Granja Tierra Fresca — correo de campaña

  Destinatario: docente universitario, ciego de nacimiento, usuario
  experto de lector de pantalla (NVDA / JAWS / VoiceOver / Narrador).

  QUÉ ES ESTE CORREO: un botón. Nada más.

  No hay párrafos, ni logo, ni firma, ni imágenes, ni pie de página con
  enlaces. Cuando el destinatario abre el correo y presiona la tecla K
  (NVDA: ir al siguiente enlace) o desliza en VoiceOver, solo existe un
  destino posible. No hay nada que recorrer, nada que descartar, nada
  entre él y la experiencia.

  ------------------------------------------------------------------
  SOBRE "QUE EL CELULAR LO LEA SOLO"
  ------------------------------------------------------------------
  Conviene decirlo sin rodeos: ningún cliente de correo del mundo deja
  que un correo se reproduzca o se lea solo al abrirlo. Outlook, Gmail
  y Mail de iOS eliminan <audio>, <script>, <iframe> y <embed> al
  recibir el mensaje. No es algo que se pueda esquivar con un truco de
  maquetación, y cada intento de esquivarlo sube la puntuación de spam
  del correo, con lo cual se pierde la entrega entera.

  Pero la lectura automática SÍ ocurre, solo que no la dispara el
  correo: la dispara el lector de pantalla que el destinatario ya tiene
  encendido. Cuando recorre su bandeja, el sistema le lee en voz alta,
  sin que él haga nada:

      1. el remitente,
      2. el ASUNTO,
      3. el TEXTO DE VISTA PREVIA (el preheader de aquí abajo).

  Ese es el autoplay real, y ya está corriendo. Por eso el trabajo de
  este archivo no es intentar sonar: es hacer que esas dos líneas que
  el sistema va a leer solo, sin permiso de nadie, valgan el minuto que
  vienen a pedir. Todo lo demás sobra, y por eso no está.
  ====================================================================
-->

  PREHEADER. Invisible en pantalla, pero es lo primero que se narra en la
  lista de la bandeja, justo después del asunto y antes de abrir el correo.
  Los espacios de ancho cero del final evitan que Outlook rellene la vista
  previa con texto del cuerpo y le quite el remate a la frase.
-->
<div style="display:none; font-size:1px; color:#f4efe6; line-height:1px; max-height:0px; max-width:0px; opacity:0; overflow:hidden;">
  Dos minutos de cocina real: el agua sobre la cáscara, el cuchillo en la pulpa, el aceite caliente. Un solo botón en todo el correo.
  &#8203;&#8203;&#8203;&#8203;&#8203;&#8203;&#8203;&#8203;&#8203;&#8203;&#8203;&#8203;&#8203;&#8203;&#8203;&#8203;&#8203;&#8203;&#8203;&#8203;&#8203;&#8203;&#8203;&#8203;&#8203;

          <td class="relleno" align="center" style="padding:0 30px;">

            <!--
              EL BOTÓN. Un enlace real dentro de una celda con color de
              fondo: no es una imagen y no es VML. Se ve en Outlook, se
              alcanza con Tab, y el lector de pantalla anuncia su texto
              completo. El texto dice a dónde lleva y cuánto dura; nunca
              diría "haga clic aquí", que a un lector de pantalla no le
              comunica absolutamente nada.
            -->

              <tr>
                <td bgcolor="#a3170f" align="center" style="background-color:#a3170f; border-radius:6px;">
