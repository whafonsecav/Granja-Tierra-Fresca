<!--
  ====================================================================
  Granja Tierra Fresca — correo de campaña

  Destinatario: docente universitario, ciego de nacimiento, usuario
  experto de lector de pantalla.

  QUÉ ES ESTE CORREO: un bloque rojo con dos frases. Nada más.
  Ni encabezado, ni párrafos, ni logo, ni firma, ni pie de página.
  Un solo enlace en todo el mensaje.

  ------------------------------------------------------------------
  ESCRITO PARA SOBREVIVIR AL COPIAR Y PEGAR
  ------------------------------------------------------------------
  Este correo no se envía desde un servidor: se abre en el navegador,
  se copia y se pega en Outlook Web. Ese viaje pasa por dos filtros —el
  portapapeles de Chrome y el sanitizador de Outlook— y ninguno de los
  dos respeta el HTML tal cual.

  Una versión anterior se veía perfecta en el navegador y llegaba rota
  a Outlook: aparecían subrayados, la línea de separación se convertía
  en un cuadro rosado y se abrían huecos enormes. Las tres causas, y
  las tres reglas que salieron de ahí:

  1. NADA de display:block dentro del enlace. Outlook lo descarta y el
     texto se desmorona. Los saltos se hacen con <br />, que sí
     sobrevive siempre.

  2. NADA de tablas anidadas dentro del enlace, ni márgenes. La línea
     de separación estaba hecha con una tabla de un píxel y márgenes
     automáticos: al perder los márgenes se volvió un bloque sólido.
     Ahora la línea son tres rayas de texto, que no hay sanitizador
     capaz de deformar.

  3. El text-decoration va en el <a> Y en un <span> por dentro. Con
     ponerlo solo en el enlace no basta: Outlook le vuelve a meter el
     subrayado azul de los enlaces. El span de adentro es el que gana.

  Regla general que se sigue de esto: espaciado con celdas y atributos
  height, nunca con margin ni padding sueltos; color y tipografía
  repetidos en cada celda, porque Outlook no hereda; y ninguna
  estructura más profunda de lo estrictamente necesario.

  ------------------------------------------------------------------
  CÓMO SE LEE ESTO CON UN LECTOR DE PANTALLA
  ------------------------------------------------------------------
  Aquí había un aria-label con la instrucción completa, confiando en
  que reemplazaría al texto visible. No sirvió: el sanitizador de
  Outlook lo elimina al pegar, así que el lector de pantalla acababa
  leyendo el contenido crudo del enlace. Y ese contenido tenía una
  línea de tres rayas de separación en medio, que el lector interpreta
  como texto y lee, o usa para partir la frase en dos. Por eso se oía
  entrecortado y sin decir qué hacer.

  La regla que sale de ahí: en un correo, lo único con lo que se puede
  contar es el TEXTO VISIBLE. Nada de atributos que expliquen aparte,
  porque puede que no lleguen.

  Por eso tampoco hay title. Un title también reemplaza al texto para
  el lector de pantalla, así que el mensaje habría cambiado según
  sobreviviera o no al pegado: en un sitio se oiría una cosa y en otro
  otra distinta. Sin él, lo que se lee es siempre lo mismo, porque es
  lo que está escrito a la vista.

  Así que ahora el enlace dice, de corrido y sin adornos en medio:

      "Grabamos dos minutos pensando en ti. Entra aquí para escucharlo"

  Dos frases seguidas, sin separadores, que se leen como una sola
  indicación y terminan diciendo qué hacer. El aire entre las dos
  líneas se consigue con line-height, que es invisible para el lector.

  El texto va escrito en minúsculas y se muestra en versalitas con
  text-transform. Escribirlo en mayúsculas de verdad haría que algunos
  lectores lo deletrearan letra por letra.

  No se escribe "Enlace" en el texto: el lector de pantalla ya anuncia
  por su cuenta que lo es, y repetirlo suena a tartamudeo.
  ====================================================================
-->

<style type="text/css">
  body, table, td, a { -webkit-text-size-adjust: 100%; -ms-text-size-adjust: 100%; }
  table { border-collapse: collapse; }
  body  { margin: 0; padding: 0; width: 100%; }

  /* Refuerzo contra el subrayado que Outlook Web le impone a los enlaces.
     Es solo un refuerzo: lo que de verdad lo evita son los estilos en línea,
     porque este bloque <style> no siempre sobrevive al pegado. */
  a, a:link, a:visited, a:hover { text-decoration: none; }

  @media (prefers-color-scheme: dark) {
    .fondo { background-color: #1b1b1b !important; }
  }
</style>
</head>

<body class="fondo" style="margin:0; padding:0; background-color:#ffffff;">

<!--
  Vista previa oculta. Solo sobrevive si el correo se envía desde Outlook de
  escritorio; en Outlook Web se pierde al copiar y pegar, y entonces la vista
  previa pasa a ser el texto del bloque. Dice lo mismo a propósito, para que
  el resultado sea idéntico por los dos caminos.
-->
<div style="display:none; font-size:1px; color:#ffffff; line-height:1px; max-height:0px; max-width:0px; opacity:0; overflow:hidden;">
